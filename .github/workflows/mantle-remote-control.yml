name: Mantle remote control

on:
  push:
    branches: [feat/mantle-remote-control]
  pull_request:
    branches: [main]
    paths:
      - 'codex-rs/login/**'
      - 'codex-rs/model-provider/**'
      - 'codex-rs/app-server/**'
      - 'codex-rs/app-server-transport/**'
      - '.github/workflows/mantle-remote-control.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mantle-remote-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: github.repository == 'jinhuang12/codex'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export source for reproducible validation
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/codex-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: codex-source-${{ github.sha }}
          path: ${{ runner.temp }}/codex-source.tar.gz
          retention-days: 1
  provider-tests:
    if: github.repository == 'jinhuang12/codex'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Test native Bedrock provider
        working-directory: codex-rs
        run: cargo test --locked -p codex-model-provider --lib amazon_bedrock
