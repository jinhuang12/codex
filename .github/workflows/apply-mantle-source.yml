name: Apply and validate Mantle source
on:
  push:
    branches: [feat/mantle-remote-control]
    paths: ['.github/workflows/apply-mantle-source.yml']
permissions:
  contents: write
jobs:
  implement:
    if: github.repository == 'jinhuang12/codex' && github.ref == 'refs/heads/feat/mantle-remote-control'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mantle-remote-control
      - name: Verify and apply source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, zlib
          data = ''.join(pathlib.Path(f'.github/mantle-patch/part{i}').read_text().strip() for i in range(4))
          # Repair two transfer transcription errors before checking the full source digest.
          data = data.replace('RIVdUIx6j', 'RIVdDUIx6j').replace('VQZxfBUZxfBUZx1V3', 'VQZxfBUZx1V3')
          patch = zlib.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '467ddea135777dd5634d36ecab6566a86224b3c760cd7f8f4bda8bcb9506fadf'
          pathlib.Path('/tmp/mantle.patch').write_bytes(patch)
          PY
          git apply --check /tmp/mantle.patch
          git apply --index /tmp/mantle.patch
          git rm -r .github/mantle-patch .github/mantle-feature.patch.b64
          git rm .github/workflows/apply-mantle-source.yml
      - uses: ./.github/actions/setup-ci
      - name: Format and commit implementation
        run: |
          cd codex-rs
          cargo fmt --all
          cd ..
          git add codex-rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: separate ChatGPT remote identity from Bedrock Mantle inference'
          git push origin HEAD:feat/mantle-remote-control
      - name: Compile changed crates and tests
        working-directory: codex-rs
        run: cargo check --locked --tests -p codex-app-server -p codex-cli -p codex-model-provider 2>&1 | tee /tmp/mantle-check.log
      - name: Run Mantle regression tests
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-model-provider --lib amazon_bedrock 2>&1 | tee /tmp/mantle-provider.log
          cargo test --locked -p codex-app-server --lib mantle 2>&1 | tee /tmp/mantle-unit.log
          cargo test --locked -p codex-app-server --test all suite::v2::mantle_remote_control 2>&1 | tee /tmp/mantle-integration.log
      - name: Export source and logs
        if: always()
        run: |
          git archive --format=tar.gz --output=/tmp/mantle-source.tar.gz HEAD
          git diff > /tmp/mantle-uncommitted.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mantle-validation-${{ github.run_id }}
          path: |
            /tmp/mantle-*.log
            /tmp/mantle-source.tar.gz
            /tmp/mantle-uncommitted.patch
          retention-days: 3
