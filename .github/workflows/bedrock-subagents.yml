name: Bedrock subagents
on:
  pull_request:
    branches: [main]
    paths:
      - 'codex-rs/**'
      - 'docs/bedrock-subagent-balancing.md'
      - 'scripts/test-bedrock-subagents.sh'
      - '.github/workflows/bedrock-subagents.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bedrock-subagents-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'jinhuang12/codex'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/codex-ci/cargo-target
          key: bedrock-subagents-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            bedrock-subagents-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
            mantle-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - name: Validate routing, credentials, message transport, and relay
        run: bash scripts/test-bedrock-subagents.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/codex-ci/cargo-target
          key: bedrock-subagents-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}
