name: AMMO teammates
on:
  pull_request:
    branches: [main]
    paths:
      - 'codex-rs/core/src/agent/**'
      - 'codex-rs/model-provider/**'
      - '.github/scripts/test-ammo-teammates.sh'
      - '.github/workflows/ammo-teammates.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ammo-teammates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free SDK space on the ephemeral hosted runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: ./.github/actions/setup-ci
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/codex-ci/cargo-target
          key: ammo-teammates-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ammo-teammates-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
            mantle-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - run: bash .github/scripts/test-ammo-teammates.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/codex-ci/cargo-target
          key: ammo-teammates-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}
