name: Validate sticky Bedrock sub-agent accounts
on:
  push:
    branches: [work/ammo-teammates-validation]
permissions:
  contents: write
concurrency:
  group: sticky-bedrock-validation
  cancel-in-progress: true
jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUST_MIN_STACK: 8388608
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Prepare exact change on pinned main
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          encoded = ''.join(pathlib.Path(f'.github/lb-patch-{i}.txt').read_text() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e5e7383de341bc0fc0d298112d0114591ebeccbcc78260ccad7c332f66c2defb'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'lb-change.patch').write_bytes(patch)
          PY
          git fetch origin 88bf5ee85c2dcba7f1b1f6f835cbd2cec0ba75a9 --depth=1
          git switch -c feat/sticky-bedrock-subagents 88bf5ee85c2dcba7f1b1f6f835cbd2cec0ba75a9
          git apply "$RUNNER_TEMP/lb-change.patch"
      - name: Free preinstalled SDK space on ephemeral hosted runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: ./.github/actions/setup-ci
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/codex-ci/cargo-target
          key: sticky-bedrock-Linux-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            sticky-bedrock-Linux-${{ hashFiles('codex-rs/Cargo.lock') }}-
            ammo-teammates-Linux-${{ hashFiles('codex-rs/Cargo.lock') }}-
            mantle-Linux-${{ hashFiles('codex-rs/Cargo.lock') }}-
      - name: Format exact implementation
        run: |
          cd codex-rs
          cargo fmt --all
          cd ..
          git diff --check
          git add .
          git diff --cached --binary > "$RUNNER_TEMP/lb-validated.patch"
      - name: Run policy, signing, restart, nested runtime and compile gates
        shell: bash
        run: |
          set -o pipefail
          bash .github/scripts/test-bedrock-subagent-accounts.sh 2>&1 | tee "$RUNNER_TEMP/lb-validation.log"
      - name: Publish only passing source on main
        shell: bash
        run: |
          git diff --exit-code
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 88bf5ee85c2dcba7f1b1f6f835cbd2cec0ba75a9
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: persistent account-affine load balancing for Bedrock sub-agents'
          git rev-parse HEAD > "$RUNNER_TEMP/lb-commit.txt"
          git rev-parse HEAD^{tree} >> "$RUNNER_TEMP/lb-commit.txt"
          git push origin HEAD:refs/heads/feat/sticky-bedrock-subagents
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/codex-ci/cargo-target
          key: sticky-bedrock-Linux-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sticky-bedrock-validation
          path: |
            ${{ runner.temp }}/lb-validated.patch
            ${{ runner.temp }}/lb-validation.log
            ${{ runner.temp }}/lb-commit.txt
          retention-days: 7
